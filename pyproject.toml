[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-tracker-mcp"
version = "0.2.0"
description = "MCP server that reads, creates, and updates Yandex Tracker issues, status, and comments without PII."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27",
  "mcp>=1.8,<2",
  "pydantic-settings>=2.6",
]

[project.scripts]
yandex-tracker-mcp = "yandex_tracker_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "ASYNC",
  "SIM",
  "RUF",
]
ignore = [
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["yandex_tracker_mcp", "tests"]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "single"
line-ending = "auto"
indent-style = "space"
